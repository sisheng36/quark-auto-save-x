<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夸克自动转存 - 登录</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('quarkAutoSave_theme') === 'light') {
            document.documentElement.classList.add('theme-light');
          }
        } catch (e) {}
      }());
    </script>
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./static/css/main.css?v=38">
    <!-- 站点图标：浏览器标签页 favicon + iOS 添加到主屏幕图标 -->
    <link rel="icon" href="./static/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./static/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="夸克自动转存">
</head>

<body class="login-page">
    <!-- 背景光晕装饰 -->
    <div class="login-aurora" aria-hidden="true">
        <span class="aurora-orb aurora-orb-1"></span>
        <span class="aurora-orb aurora-orb-2"></span>
        <span class="aurora-orb aurora-orb-3"></span>
    </div>

    <div class="login-card glass-panel">
        <div class="login-brand">
            <div class="login-logo"><i class="bi bi-clouds"></i></div>
            <h1 class="login-title"><a href="https://github.com/sisheng36/quark-auto-save-x" target="_blank">夸克自动转存</a></h1>
            <p class="login-subtitle">欢迎回来，请登录您的账号</p>
        </div>
        <div class="login-body">
            {% if message %}
            <div class="alert" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> [[ message ]]
            </div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="login-field">
                    <i class="bi bi-person"></i>
                    <input type="text" class="form-control" id="username" name="username" placeholder="用户名" autocomplete="username" required {% if locked %}disabled{% endif %}>
                </div>
                <div class="login-field">
                    <i class="bi bi-lock"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="密码" autocomplete="current-password" required {% if locked %}disabled{% endif %}>
                </div>
                <button type="submit" class="btn btn-login" {% if locked %}disabled{% endif %}>
                    {% if locked %}请稍后再试{% else %}登 录{% endif %}
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
        </div>
        <div class="login-footer">
            <a href="https://github.com/sisheng36/quark-auto-save-x" target="_blank"><i class="bi bi-github"></i> Quark Auto Save X</a>
        </div>
    </div>
</body>

</html>
